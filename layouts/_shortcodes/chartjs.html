{{ $id := .Get "id" | default (printf "chartjs-%d" .Ordinal) }}<div class="solitude-tag chartjs-container tag-chart {{ if .Get "layout" }}chartjs-abreast{{ end }}" data-chartjs-id="{{ $id }}" {{ with .Get "width" }}data-width="{{ . }}%"{{ end }}><pre class="chartjs-src" hidden>{{ strings.TrimSpace .Inner }}</pre>{{ with .Get "description" }}<div class="chartjs-desc">{{ . | markdownify }}</div>{{ end }}</div>
