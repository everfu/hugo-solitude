<figure class="solitude-tag tag-gallery-group gallery-group">{{ with .Get "img" }}<img class="gallery-group-img no-lightbox" src="{{ . | safeURL }}" alt="Group Image Gallery">{{ end }}<figcaption><div class="gallery-group-name">{{ .Get "title" | default (.Get "name") }}</div><p>{{ .Inner | markdownify }}</p>{{ with .Get "url" }}<a href="{{ . | safeURL }}"></a>{{ end }}</figcaption></figure>
