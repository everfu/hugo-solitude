{{ $repo := .repo }}{{ $endpointRepo := cond (.encode | default false) ($repo | urlquery) $repo }}{{ $parts := split $repo "/" }}<article class="solitude-tag repo-card tag-repo" data-repo-provider="{{ .provider }}" data-repo-endpoint="{{ .api }}{{ $endpointRepo }}" aria-busy="true"><div class="repo-card-header"><span class="repo-provider"><i class="fab fa-{{ if in (slice "gitee" "gitea") .provider }}git-alt{{ else }}{{ .provider }}{{ end }}" aria-hidden="true"></i>{{ .label }}</span><img class="repo-language no-lightbox" alt="" loading="lazy" hidden></div><a class="repo-title" href="{{ .base }}/{{ $repo }}" target="_blank" rel="noopener noreferrer">{{ index $parts (sub (len $parts) 1) }}</a><p class="repo-desc">正在读取仓库信息…</p><div class="repo-card-footer"><div class="repo-gist" aria-label="Repository statistics"><span><i class="fas fa-star" aria-hidden="true"></i><span class="repo-stars">—</span></span><span><i class="fas fa-code-branch" aria-hidden="true"></i><span class="repo-forks">—</span></span></div><span class="repo-status" role="status">加载中</span></div></article>
