{{ $cfg := site.Params.solitude.envelope }}<div class="article-container">{{ .Content }}{{ if $cfg.enable }}<div class="switch_message"><button class="open" type="button" data-solitude-action="setTargetClass" data-solitude-target="#barrage" data-solitude-class="hide" data-solitude-enabled="false"><span>打开弹幕</span></button><button class="close" type="button" data-solitude-action="setTargetClass" data-solitude-target="#barrage" data-solitude-class="hide" data-solitude-enabled="true"><span>关闭弹幕</span></button></div><div id="barrage" data-line="{{ $cfg.line }}" data-speed="{{ $cfg.speed }}" data-hover="{{ $cfg.hover }}" data-loop="{{ $cfg.loop }}"></div>{{ end }}</div>
