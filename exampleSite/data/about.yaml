  - type: story
    label: 项目故事
    title: 为什么维护 Solitude？
    content: |
      Solitude 希望提供一个可以安静积累内容、认真表达想法的地方。页面不必喧闹，但每一篇文章都应该被清楚地组织、舒适地阅读，也能被搜索、分类和长期保存。

      Hugo 版本保留熟悉的视觉与交互，同时重新使用原生页面集合、Taxonomies、Go Templates 和资源管线组织主题。构建过程不再依赖 Node.js，配置与数据契约也更容易理解和维护。

      这个示例站不是个人资料模板，而是一份可以直接运行的项目说明：从首页、文章和侧栏，到关于、友链、开发工具、音乐与即刻短文，每一部分都展示当前主题真实支持的能力。

      Solitude 会继续围绕**内容体验、无障碍、性能与长期维护**改进，让主题的丰富功能始终服务于表达本身。
